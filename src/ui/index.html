  // `--approved` is passed, and this dialog is the only place that flag is
  // supposed to come from. So the gate is not "the window is nicer about it" —
  // an agent that tries the same launch is stopped, and told to come here.
  // Taking the sign-in out of the daily cabinet is the second thing behind that
  // gate, and the only one with no way back: nothing is kept, on purpose.
  // ⚠️ "Do not ask again" silences the dialog, never the gate — the approval is
  // still sent, and it still counts only because this window sent it.
  const droppingDailySignIn = main && signInPlan === false
  if (droppingDailySignIn && state?.settings?.['ask-on-daily'] !== 'off' && !await ask({
    title: t('ui.signOutAskTitle'),
    body: `<p class="warn" style="margin-top:0">${t('ui.signOutAskBody')}</p>`
      + `<p style="margin:0">${t('ui.signOutAskNote')}</p>`,
    ok: t('ui.signOutOk'), danger: true,
  })) return

  const approved = (main && version !== '') || droppingDailySignIn
  if (main && version !== '' && !await ask({
    title: t('ui.notice'),
    // The two axes are named separately and up front. Written as one sentence
    // they blur together — "your dsh will use another version" reads as a fact
    // about the machine, when the thing being touched is the user's own
    // workspace files. Which is exactly why this combination is the one worth
    // asking about: neither half is dangerous alone.
    //
    // ⚠️ The third point is a notice, not a promise. `start --main` refuses
    // when 3080 is already serving, so two launches *through here* cannot
    // collide; a dsh the user starts some other way, or one moved to another
    // port, is outside what this tool can see — let alone prevent.
    body: `<p class="warn" style="margin-top:0">${t('ui.approveHead', { version: escape(version) })}</p>`
      + `<p style="margin:0">${t('ui.approvePoint1')}</p>`
      + `<p style="margin:6px 0 0">${t('ui.approvePoint2')}</p>`
      + `<p style="margin:6px 0 0">${t('ui.approvePoint3')}</p>`,
    ok: t('ui.approveOk'), danger: true,
  })) return

  $('startBtn').disabled = true
  const out = $('startOut')
  try {
    const argv = ['start', ...(main ? ['--main'] : ['--sandbox', workspace]), ...machineFlag(), ...pluginFlags()]
    // Three different sentences, and only one of them is about creation:
    // `--no-sign-in` says what a cabinet is born without, while `--sign-in` and
    // `--sign-out` change one that already exists.
    const unborn = !main && !state.sandboxes.some((entry) => entry.name === workspace)
    if (unborn) {
      if (signInPlan === false) argv.push('--no-sign-in')
    } else if (signInPlan === true) argv.push('--sign-in')
    else if (signInPlan === false) argv.push('--sign-out')
    // Carried only because the dialog above was answered, just now, by a person.
    if (approved) argv.push('--approved')
    const result = await watchLog(out, main ? ['logs', '--main'] : ['logs', workspace], t('ui.startingHead'), run(argv))
    const where = main ? escape(t('ui.dailyCabinet')) : t('ui.sandboxQuoted', { name: escape(result.sandbox) })
    out.innerHTML = `<div class="ok">${t('ui.startedMsg', {
      where,
      engine: escape(t(result.engine?.kind === 'host' ? 'ui.engineHost' : 'ui.engineRelease')),
      version: escape(result.version ?? ''),
    })}
      <a href="${result.url}" target="_blank" rel="noreferrer">${t('ui.openUrl', { url: escape(result.url) })}</a></div>`
    $('nameHint').hidden = true
    // The pending changes just became real, and the refresh below reads them
    // back off disk. Leaving them ticked would show the same intention twice —
    // once as a fact and once as something still to do.
    picked.clear()
    dropping.clear()
    signInPlan = null
    await refresh()
  } catch (error) {
    out.innerHTML = `<div class="err">${escape(error.message)}</div>`
    // The rule appears now, next to the box being typed in, and comes from the
    // refusal rather than from a copy kept here.
    const rule = error.result?.code === 'BAD_SANDBOX_NAME' ? error.result.rule : null
    $('nameHint').hidden = rule === null
    if (rule !== null) $('nameHint').textContent = t('ui.nameRule', { rule })
  } finally {
    $('startBtn').disabled = false
  }
}

/**
 * Quit: stop every sandbox, then stop being a window.
 *
 * The warning is shown only when there is something to lose and only while the
 * person still wants it. It exists because "sandbox launcher" undersells what
 * this is — the sandboxes are managed from here, and closing the window stops
 * them, which is not what someone who thinks they merely pressed start would
 * expect. "Do not ask again" is a setting rather than something this page
 * remembers: it survives a restart, so it belongs to the program, and
 * everything belonging to the program is reachable from a command.
 */
$('quitBtn').onclick = async () => {
  const live = state?.running ?? []
  const main = state?.main ?? null
  const ask = state?.settings?.['ask-on-quit'] !== 'off'
  if ((live.length > 0 || main !== null) && ask) {
    // Same skeleton as the other dialog: the two things involved, named on
    // their own lines, then what happens to them. Nothing explains a mechanism.
    const rows = [live.length === 0
      ? t('ui.quitRowSandboxNone')
      : t('ui.quitRowSandbox', { count: live.length, names: escape(live.map((r) => r.sandbox).join('、')) })]
    rows.push(main !== null
      ? t('ui.quitRowMainHere', { pid: main.pid })
      // Said out loud when there is a dsh we can see but not act on, so the
      // absence of the checkbox below is an explained absence, not a gap.
      : state?.mainDshOnDefaultPort === true
        ? t('ui.quitRowMainForeign')
        : t('ui.quitRowMainNone'))
    $('quitWhat').innerHTML = `<p class="warn" style="margin:0 0 10px">${rows.join('<br>')}</p>`
      + `<p style="margin:0">${t('ui.quitPoint1')}</p>`
    $('quitMainWrap').hidden = main === null
    $('quitMain').checked = false
    if (main !== null) $('quitMainNote').textContent = t('ui.quitMainNote')
    $('quitDontAsk').checked = false
    return void $('quitDialog').showModal()
  }
  await quitNow(false)
}

/**
 * Get rid of a plugin, asking first when the daily workspace is involved.
 *
 * ⭐ The dialog is the same shape as the quit one, and its switch is a separate
 * one on purpose (CEO 2026-08-22): that one says "quitting stops the processes
 * behind this window", this one says "this also comes out of the workspace you
 * work in every day". Two different sentences, so silencing one must not
 * silence the other.
 *
 * ⛔ The tick is stored by a command, never in the page: anything that outlives
 * a reload is part of the model, and everything in the model is reachable from
 * the command line.
 */
async function removePlugin(plugin) {
  const failure = await run(['plugins', 'rm', plugin.id]).then(() => null, (error) => error)
  if (failure === null) {
    picked.delete(plugin.id)
    return void await refresh()
  }
  // The refusal travels whole on `.result`, with its details at the top level —
  // the same object the command line printed, not a paraphrase of it.
  const refusal = failure.result ?? {}
  if (refusal.code !== 'NEEDS_APPROVAL') {
    $('startOut').innerHTML = `<div class="err">${escape(failure.message)}</div>`
    return
  }
  // ⭐ The command line now refuses every caller that is not this window, so a
  // refusal arrives even when the person has said "stop asking me". That switch
  // was never about the gate — it is about being asked twice by a window they
  // are already sitting in front of. So: no dialog, but still an approval, and
  // the approval still only counts because it came from here.
  if (state?.settings?.['ask-on-daily'] === 'off') {
    try {
      await run(['plugins', 'rm', plugin.id, '--approved'])
      picked.delete(plugin.id)
    } catch (error) {
      $('startOut').innerHTML = `<div class="err">${escape(error.message)}</div>`
    }
    return void await refresh()
  }
  // The refusal names places by identifier, not by label — see `removeEverywhere`.
  // Turning them into words is this side's job, which is what makes the same
  // refusal readable here and stable for whatever else reads `--json`.
  const places = (refusal.places ?? []).map((place) => (place.main === true ? t('cabinet.daily') : place.sandbox))
  $('dropWhat').innerHTML = '<p class="warn" style="margin:0 0 10px">'
    + `${t('ui.dropRowPlugin', { label: escape(plugin.label ?? plugin.package) })}<br>`
    + `${t('ui.dropRowPlaces', { places: escape(places.join('、')) })}</p>`
    + `<p style="margin:0 0 6px">${t('ui.dropPoint1')}</p>`
    + `<p style="margin:0">${t(refusal.downloaded === true ? 'ui.dropPoint2Downloaded' : 'ui.dropPoint2Yours')}</p>`
  $('dropDontAsk').checked = false
  pendingDrop = plugin
  $('dropDialog').showModal()
}

/** The plugin the confirm dialog is currently about. */
let pendingDrop = null

$('dropCancel').onclick = () => $('dropDialog').close()
$('dropConfirm').onclick = async () => {
  const plugin = pendingDrop
  $('dropDialog').close()
  if (plugin === null) return
  if ($('dropDontAsk').checked) await run(['config', 'ask-on-daily', 'off']).catch(() => {})
  try {
    await run(['plugins', 'rm', plugin.id, '--approved'])
    picked.delete(plugin.id)
  } catch (error) {
    $('startOut').innerHTML = `<div class="err">${escape(error.message)}</div>`
  }
  await refresh()
}

$('quitCancel').onclick = () => $('quitDialog').close()
$('quitConfirm').onclick = async () => {
  const withMain = $('quitMain').checked
  $('quitDialog').close()
  if ($('quitDontAsk').checked) await run(['config', 'ask-on-quit', 'off']).catch(() => {})
  await quitNow(withMain)
}

async function quitNow(withMain) {
  try {
    const result = await run(withMain ? ['quit', '--main'] : ['quit'])
    stopPolling()
    const alsoMain = result.main === null ? '' : t('ui.quitAlsoMain', { pid: result.main.pid })
    document.body.innerHTML = `<main><section class="card"><h2>${t('ui.quitDoneTitle')}</h2>`
      + `<p>${t('ui.quitDoneBody', { count: result.stopped.length, alsoMain })}</p></section></main>`
  } catch (error) {
    $('startOut').innerHTML = `<div class="err">${escape(error.message)}</div>`
  }
}

function escape(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
}

// The language switch: shows the *other* language's own name, and switching
// is the same `config lang` anyone would run. The served page carries the
// language, so reloading is what makes the switch real — window and command
// line change together, because both read the same setting.
{
  const other = LANG === 'zh' ? 'en' : 'zh'
  $('langBtn').textContent = LANG_NAMES[other] ?? other
  $('langBtn').hidden = false
  $('langBtn').onclick = async () => {
    try {
      await run(['config', 'lang', other])
      location.reload()
    } catch (error) {
      // An agent holding the window already answered with the hint; anything
      // else is said where every other refusal is said.
      if (error.result?.code !== 'AGENT_HOLDS_WINDOW') {
        document.body.insertAdjacentHTML('afterbegin', `<div class="err">${escape(error.message)}</div>`)
      }
    }
  }
}

refresh().catch((error) => {
  // ⛔ The spinner has to stop even when the read never lands. A wheel that
  // turns forever says "still working" about something that has already given
  // up, and that is the one thing it must not say.
  $('booting').innerHTML = `<div class="err" style="margin:0">${t('ui.stateUnreadable', { error: escape(error.message) })}</div>`
  document.querySelector('main')?.classList.add('booting')
})

// Sandbox links open through the service in the system's default browser.
// Inside the desktop shell the webview has no tabs, so a plain _blank link
// silently does nothing; in a normal browser this lands in a new tab the
// same as before. One behavior, both worlds.
document.addEventListener('click', (event) => {
  const link = event.target.closest?.('a[href^="http://127.0.0.1:"]')
  if (!link) return
  event.preventDefault()
  api('/api/open', { url: link.href }).catch(() => { window.open(link.href, '_blank') })
})

// Keep the running list honest without touching what the user is editing:
// only the read-only sections are redrawn. Reading is a plain disk read on the
// other side — no process is started for it, which is what makes a poll this
// frequent reasonable at all.
//
// ⭐ Two seconds rather than eight because this is now also how the window
// notices an agent. The delay before the glass comes down is this interval, and
// eight seconds of an unlocked window while something else is driving it is the
// one thing the frame exists to prevent.
const polling = setInterval(async () => {
  try {
    state = await api('/api/state')
    // The workspace row is redrawn too — sandboxes appear and disappear from
    // the other entrance — but the selection is a variable here, not something
    // read back off the page, so a redraw cannot move it.
    // Plugins are redrawn too: another entrance can install one, and the ticks
    // are read from variables rather than off the page, so a redraw cannot
    // disturb a choice being made.
    // `drawDownload` is here for the same reason the plugin rows are: another
    // entrance can start an install, and this tick is how the window finds out.
    drawRunning(); drawWorkspaces(); drawPlugins(); drawDownload(); drawAgent()
  } catch {
    // The next tick retries; a dead server shows up on the next click anyway.
  }
}, 2000)

/** Stop polling, for when there is deliberately nothing left to poll. */
function stopPolling() {
  clearInterval(polling)
}
</script>
</body>
</html>
