<!doctype html>
<html lang="__DSH_BOX_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="ui.title"></title>
<style>
  :root {
    --ink: #17181c; --dim: #6b7280; --line: #e3e5ea; --bg: #f6f7f9;
    --card: #fff; --accent: #8a6a1f;
    --cream: #fdf8ec; --cream-line: #ecdfc0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.7 ui-sans-serif, -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; justify-content: center; padding: 28px 16px 64px;
  }
  main { width: 100%; max-width: 620px; }
  h1 { font-size: 19px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--dim); margin: 0 0 20px; font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; }
  .card > h2 { font-size: 13px; letter-spacing: .04em; color: var(--dim); margin: 0 0 12px; font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 7px 13px; cursor: pointer; font: inherit; line-height: 1.4; position: relative; }
  .chip .x { position: absolute; top: 1px; right: 7px; color: var(--dim); font-size: 14px; line-height: 1.4; }
  .chip .x:hover { color: #b91c1c; }
  /*
    Selection greys a chip down rather than outlining it — outlines are being
    kept clear for the agent frame. It is a translucent layer over whatever the
    chip already is, so a cream chip greys to warm grey and a white one to plain
    grey: "this is yours" and "this is chosen" stay separately readable.
  */
  .chip[aria-pressed="true"] { box-shadow: inset 0 0 0 999px rgba(23, 24, 28, .075); font-weight: 600; }
  .chip small { display: block; color: var(--dim); font-weight: 400; font-size: 11px; }
  .chip[aria-pressed="true"] small { color: var(--dim); opacity: .9; }
  input[type=text] { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: inherit; }
  input[type=text]:focus { outline: 2px solid #bfd3ff; border-color: var(--accent); }
  select { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: inherit; }
  details.older { margin-top: 10px; }
  details.older summary { cursor: pointer; color: var(--dim); font-size: 12.5px; }
  details.older .row { margin-top: 8px; }
  label.check { display: flex; gap: 9px; align-items: flex-start; padding: 7px 0; cursor: pointer; }
  label.check input { margin-top: 6px; }
  label.check span b { font-weight: 600; }
  label.check span i { font-style: normal; color: var(--dim); display: block; font-size: 12.5px; }
  /*
    Three states, three ticks, and the box itself always stays white.
    ⭐ That is what keeps the agent frame's blue from colliding with a ticked
    box: filled colour is never used here, so a solid blue on this page can only
    ever mean "an agent is driving". Green says the workspace already has this
    one; blue says this launch will add it; an empty box on a green row says
    this launch will take it away.
  */
  .tick {
    appearance: none; -webkit-appearance: none; flex: 0 0 auto;
    width: 15px; height: 15px; margin-top: 6px; border: 1.5px solid #c8ccd6;
    border-radius: 4px; background: #fff; cursor: pointer; position: relative;
  }
  .tick:checked::after {
    content: ''; position: absolute; left: 4px; top: 0px; width: 4px; height: 9px;
    border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(42deg);
  }
  .tick.add { color: #2563eb; }
  .tick.add:checked { border-color: #2563eb; }
  .tick.have { color: #16a34a; }
  .tick.have:checked { border-color: #16a34a; }
  .tick:disabled { color: var(--dim); border-color: var(--line); cursor: default; background: #fafbfc; }
  .going b, .going i { color: var(--dim); }
  .going b { text-decoration: line-through; }
  .tag { font-size: 11px; border-radius: 5px; padding: 1px 6px; margin-left: 6px; font-weight: 600; vertical-align: 1px; }
  /* Something this run deleted. Dashed and unclickable, because it is not on
     this page any more — only in the record. */
  .ghost { border-style: dashed !important; opacity: .62; pointer-events: none; color: var(--dim); }
  .ghost small { display: block; font-size: 11px; }
  /* A step in review: clickable, and the one being looked at is marked. */
  .step { cursor: pointer; border-radius: 8px; }
  .step:hover { background: #f6f8fb; }
  .step.picked { background: #eef4ff; box-shadow: inset 2px 0 0 #2563eb; }
  .tag.have { background: #ecfdf5; color: #15803d; }
  .tag.add { background: #eff6ff; color: #1d4ed8; }
  .tag.going { background: #f3f4f6; color: #6b7280; }
  .tag.theirs { background: #fff8ed; color: #92620a; }
  /* Deliberately not blue: see the note on .chip.native. */
  button.go { width: 100%; padding: 12px; font: inherit; font-weight: 600; border: 0; border-radius: 8px; background: var(--ink); color: #fff; cursor: pointer; }
  button.go:disabled { background: #9aa4b8; cursor: default; }
  .mini { background: none; border: 0; color: var(--dim); cursor: pointer; font: inherit; font-size: 12px; text-decoration: underline; padding: 0 4px; }
  .mini:disabled { opacity: .35; cursor: default; text-decoration: none; }
  .list { border-top: 1px solid var(--line); }
  .item { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .item em { font-style: normal; color: var(--dim); font-size: 12.5px; display: block; }
  pre { background: #11131a; color: #dfe3ec; padding: 12px; border-radius: 8px; overflow: auto; font-size: 12px; max-height: 220px; margin: 12px 0 0; line-height: 1.5; }
  .ok { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; padding: 12px 14px; border-radius: 8px; margin-top: 12px; }
  .ok a { color: #065f46; font-weight: 700; }
  .err { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 12px 14px; border-radius: 8px; margin-top: 12px; white-space: pre-wrap; }
  .partial { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; padding: 12px 14px; border-radius: 8px; margin-top: 12px; white-space: pre-wrap; }
  .path { color: var(--dim); font-size: 12px; word-break: break-all; margin: 12px 0 0; }
  .quitrow { display: flex; justify-content: center; margin-top: 4px; }
  /*
    Cream means one thing, wherever that thing is true: this is yours, not a
    copy we made. The machine already installed on this computer, a folder you
    pointed us at, and the workspace you actually work in. Everything white is
    disposable — a download, a sandbox.
    It is not a state and not a selection: the native chip stays cream whether
    or not it is picked, and selection is said with the border instead, so both
    can be read at once without either borrowing the other's colour. Blue is
    spent on nothing here at all, which is what leaves it free to mean "an agent
    is driving" and only that.
  */
  .chip.native { background: var(--cream); border-color: var(--cream-line); }
  .chip.native small { color: #8a7440; }
  button.go.mine { background: var(--cream); color: #6b5417; border: 1px solid var(--cream-line); font-weight: 600; }
  .warn { background: #fff8ed; border: 1px solid #fcd9a5; color: #7a4a09; padding: 10px 12px; border-radius: 8px; margin: 10px 0 0; }
  /*
    An agent is driving. Blue was kept out of everything else on this page for
    exactly this: nowhere does it mean anything but "not yours right now".

    ⛔ There was frosted glass here and it is gone: it made the page hard to
    read to say something the border and the badge already say, and the whole
    point of the numbered frames is that they can be read while it is on.
    Nothing was lost with it — it never blocked anything, it only looked as
    though it did.
  */
  /*
    Two blues, two jobs, and they must not be the same blue.

    **Pale blue, around the whole window**: an agent is driving. It is ambient —
    it says nothing about any particular control, so it stays quiet and wide.
    **Solid blue, around one option**: command ① touched *this*. It is a
    pointer, so it is sharp and narrow.

    ⛔ Seven pixels, not three. Three was measured on a real screen and came out
    at 2.1 physical pixels — a hairline at the edge of the viewport on a pale
    grey background. It was there and it could not be seen, which for the one
    signal that says "you are not driving" is the same as not being there.
  */
  body.agent { padding-top: 92px; }
  /*
    Dimmed, not disabled, and cosmetic on purpose: the refusal lives in the
    service. A control marked wrongly here looks unavailable and still answers
    with a sentence — never the reverse, where it looks available and writes.
  */
  body.agent .held { opacity: .45; }
  #lockedHint {
    display: none; position: fixed; z-index: 60; left: 50%; bottom: 26px;
    transform: translateX(-50%); background: #1d4ed8; color: #fff;
    border-radius: 8px; padding: 9px 16px; font-size: 13px; box-shadow: 0 6px 20px rgba(29,78,216,.35);
  }
  #lockedHint.on { display: block; }
  body.agent::after {
    content: ''; position: fixed; inset: 0; z-index: 40; pointer-events: none;
    border: 7px solid #93c5fd;
  }
  #badge { display: none; }
  body.agent #badge {
    display: flex; position: fixed; z-index: 50; left: 0; right: 0; top: 0;
    gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap;
    background: #1d4ed8; color: #fff; padding: 10px 16px; font-size: 13px;
  }
  #badge b { font-weight: 600; }
  /*
    A frame is a footprint — "command ① touched this" — never a claim about what
    the control says now. That is why it is not cleared when a value changes,
    and why one command touching four controls puts the same number on all four:
    the number is the command's identity, not a step counter.
  */
  .agent-mark { position: relative; outline: 2px solid #3b82f6; outline-offset: 4px; border-radius: 8px; }
  .agent-mark::before {
    content: attr(data-seq); position: absolute; left: -10px; top: -13px; z-index: 5;
    background: #3b82f6; color: #fff; font-size: 11px; line-height: 1.5;
    padding: 1px 7px; border-radius: 9px; font-weight: 600; white-space: nowrap;
  }
  dialog { border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; max-width: 420px; color: inherit; font: inherit; }
  /* Until the first read lands, the cards below have nothing in them. Hiding
     them is what makes the difference between "still loading" and "broken"
     legible without reading any text. */
  #booting { display: flex; align-items: center; gap: 8px; color: var(--dim); }
  main.booting > .card:not(#booting), main.booting > .quitrow, main.booting > .path { display: none; }
  main:not(.booting) > #booting { display: none; }
  .spin {
    width: 13px; height: 13px; border-radius: 50%; display: inline-block;
    border: 2px solid var(--line); border-top-color: var(--dim);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #recallBody {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 20px; margin-top: 8px; max-height: 46vh; overflow: auto;
  }
  /* While an agent drives, the border matches the frame around everything else
     it touched — one visual language, not a second one for this box. */
  body.agent #recallBody { border-color: #93c5fd; }
  #recallBody pre { max-height: none; white-space: pre-wrap; word-break: break-all; margin: 6px 0 0; }
  dialog::backdrop { background: rgba(17, 19, 26, .38); }
  dialog h3 { margin: 0 0 8px; font-size: 15px; }
  dialog p { margin: 0 0 10px; }
  dialog .row { justify-content: flex-end; margin-top: 14px; }
  .danger { border-color: #fecaca; background: #fef2f2; color: #991b1b; font-weight: 600; }
  /* The language switch. Fixed to the corner so it is never scrolled away
     from; under agent control it drops below the badge instead of hiding
     behind it. */
  #langBtn { position: fixed; top: 12px; right: 16px; z-index: 30; }
  body.agent #langBtn { top: 100px; }
</style>
</head>
<body>
<!--
  Shows the *other* language's own name — the one thing that must not be
  translated into the current language, because its reader is whoever cannot
  read the current language. Switching runs `config lang` through the same
  command channel as every other button, then reloads: the served page carries
  the language, so a reload is the switch.
-->
<button class="mini" id="langBtn" data-cmd hidden></button>
<main class="booting">
  <h1 data-i18n="ui.title"></h1>
  <p class="sub" data-i18n="ui.intro"></p>

  <!--
    ⚠️ Shown until the first read comes back, because that read is not instant:
    the machine and the sandboxes come off this disk, but "which versions exist"
    is a question for the npm registry, and until it answers the page has nothing
    to draw. Empty cards while that happens read as a broken window rather than
    a busy one — the fix is to say which of the two it is.
  -->
  <div class="card" id="booting"><span class="spin"></span><span data-i18n="ui.booting"></span><span class="sub"
    style="display:inline;margin-left:6px" data-i18n="ui.bootingSlow"></span></div>

  <section class="card">
    <h2 data-i18n="ui.machineCard"></h2>
    <p class="sub" id="machineHint" style="margin:-4px 0 10px"></p>
    <div class="row" id="versions"></div>
    <details class="older" id="olderWrap" hidden>
      <summary data-i18n="ui.olderVersions"></summary>
      <div class="row" id="olderVersions"></div>
    </details>
    <div class="row" style="margin-top:10px">
      <input type="text" id="customVersion" data-i18n-placeholder="ui.customVersionPh" style="flex:1;min-width:200px">
      <button class="chip" id="pullBtn" data-cmd data-mark="go:pull" data-i18n="ui.pull"></button>
    </div>
    <!--
      A dsh that is neither this computer's nor one we downloaded: a build made
      from source, or the copy inside an application. Naming one is a choice,
      not a command — nothing is fetched, nothing is written, and the same
      folder typed twice means the same thing. So this box sends nothing; it
      only puts another chip in the row above.
      ⛔ No list of folders is stored anywhere. The chips are worked out from
      what the sandboxes were last started on, the same way the plugin list
      stopped being a registry: a name that can be derived should not also be
      a thing to keep, delete and get out of date.
    -->
    <div class="row" style="margin-top:10px">
      <input type="text" id="enginePath" data-i18n-placeholder="ui.enginePathPh" style="flex:1;min-width:280px">
      <button class="chip" id="usePathBtn" data-i18n="ui.usePath"></button>
    </div>
    <div class="row" style="margin-top:10px">
      <span class="sub" style="margin:0" data-i18n="ui.sourceLabel"></span>
      <select id="source" data-cmd data-mark="go:source">
        <option value="auto" data-i18n="ui.sourceAuto"></option>
        <option value="official" data-i18n="ui.sourceOfficial"></option>
        <option value="mirror" data-i18n="ui.sourceMirror"></option>
      </select>
    </div>
    <div id="pullOut"></div>
  </section>

  <!--
    The second axis, drawn exactly like the first: a row of choices, one of
    which is cream because it is not a copy of anything — it is the workspace
    the user actually works in. The daily one and the sandboxes sit in the same
    row because the launcher makes no distinction either; `DSH_HOME` is a
    location, and these are the locations. What differs is only that the daily
    one is never offered for deletion.
    The text box below is for naming a new one and nothing else. It used to
    *be* the selection, which meant the current choice lived in a field that
    also accepted typing — no way to draw a highlight around "what is selected"
    without also drawing one around "what is being typed".
  -->
  <section class="card">
    <h2 data-i18n="ui.cabinetCard"></h2>
    <p class="sub" id="workspaceHint" style="margin:-4px 0 10px"></p>
    <div class="row" id="workspaces"></div>
    <div id="workspaceDetail"></div>
    <div class="row" style="margin-top:12px">
      <input type="text" id="sandboxName" data-i18n-placeholder="ui.newSandboxPh" style="flex:1;min-width:200px">
      <button class="chip" id="newSandboxBtn" data-i18n="ui.newSandbox"></button>
    </div>
    <!--
      The naming rule is not shown until a name is refused. Rules on screen
      before anyone has done anything wrong are noise that gets read once and
      then never again; the same sentence arriving the moment it applies is
      read every time. The text still has exactly one home — it comes from the
      refusal itself, which carries the rule with it.
    -->
    <p class="sub" id="nameHint" style="margin:8px 0 0" hidden></p>
    <label class="check" id="signInWrap" data-mark="go:signIn"><input type="checkbox" id="importSignIn" checked>
      <span><b data-i18n="ui.importSignIn"></b><span class="tag" id="signInTag"></span><i id="signInNote"></i></span></label>
    <div id="adoptOut"></div>
  </section>

  <!--
    After the workspace, because it is now about the workspace. A plugin is
    registered in a filing cabinet and stays there, so "which plugins" is not a
    property of this launch and cannot be asked before the cabinet is chosen.
    This card used to sit above and mean "carry these along this time".
  -->
  <section class="card">
    <h2 data-i18n="ui.pluginsCard"></h2>
    <p class="sub" id="pluginHint" style="margin:-4px 0 10px"></p>
    <div id="plugins"></div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="pluginDir" data-mark="go:pluginDir" data-i18n-placeholder="ui.pluginDirPh" style="flex:1;min-width:280px">
      <button class="chip" id="pluginBrowse" hidden data-i18n="ui.browse"></button>
      <button class="chip" id="addPluginBtn" data-cmd data-mark="go:addPlugin" data-i18n="ui.addPlugin"></button>
    </div>
    <!--
      The other way in: a published package, fetched by name. The command line
      has had this road for a while (`get plugin <包名> --to <档案柜>`); this is
      the same road with the same words, aimed at the sandbox selected above.
      ⚠️ 仍然只装进沙箱,而这条限制的**理由已经过期**:它当初是因为日常柜那道闸门
      只能靠页面自己拼一个 --approved,而现在闸门有了真弹窗,页面走同一条路即可。
      留着不动是因为它是产品行为不是改名(等 CEO 裁决)。
    -->
    <div class="row" style="margin-top:10px">
      <input type="text" id="npmName" data-cmd data-mark="go:npmName" data-i18n-placeholder="ui.npmNamePh" style="flex:1;min-width:280px">
      <button class="chip" id="npmInstallBtn" data-cmd data-mark="go:npmInstall" data-i18n="ui.npmInstall"></button>
      <!--
        Shown only while something is downloading. ⛔ Static and hidden rather
        than built inside `drawDownload`, so the mark guard can see it: a control
        conjured by a script is a control that leaves the check nothing to read,
        which is evading the guard rather than satisfying it.
      -->
      <button class="chip" id="npmCancelBtn" hidden data-cmd data-mark="go:npmCancel" data-i18n="ui.npmCancel"></button>
    </div>
    <p class="sub" style="margin:6px 0 0" data-i18n="ui.npmNote"></p>
    <div id="npmOut"></div>
  </section>

  <section class="card">
    <button class="go" id="startBtn" data-cmd data-mark="go:start"></button>
    <div id="startOut"></div>
  </section>

  <section class="card" id="runningCard" hidden>
    <h2 data-i18n="ui.runningCard"></h2>
    <div class="list" id="running"></div>
  </section>

  <!--
    ⛔ It was a modal dialog, which contradicted the one thing it exists for: the
    frames, the badge and this list are all here so a person can *see what is
    happening on the page*, and a modal covers the page in order to show them.
    CEO 2026-08-22: the recall should be the blue frame plus an in-page
    expansion below — not a modal covering the main page.

    ⚠️ Inside <main>, at the bottom of the page, where the button used to be
    (CEO 2026-08-22, after seeing it beside the page instead: not side by side
    on the right — scrolled to the very bottom as before. `body` is a row, so
    a sibling of <main> lands next to it rather than under it).

    Open and keeping up while an agent drives — that is the moment the question
    "what is it doing to my settings" is being asked, and it is the only place
    the steps with no control to frame (`status`, `logs`, `memory`) can be seen
    at all. Folds to one line once the run is over: the frames go at that point
    (a window that keeps them is permanently dirty), the record stays.
  -->
  <section id="recallPanel" hidden>
    <div class="quitrow"><button class="mini" id="recallToggle" aria-expanded="false"></button></div>
    <div id="recallBody" hidden></div>
  </section>
  <p class="path" id="boxPath"></p>
  <div class="quitrow"><button class="mini" id="quitBtn" data-cmd data-mark="go:quit" data-i18n="ui.quit"></button></div>
</main>

<!--
  Outside <main>, fixed to the top, so what is being done to this data directory
  from elsewhere is never scrolled away from.

  ⛔ There used to be a "stop and take back control" button here, and it is gone
  with the takeover it ended: the window now stands aside only while a command is
  actually running, and that ends by itself when the command does. A button whose
  whole job is to undo something that undoes itself is one more thing to explain.
-->
<div id="badge">
  <span id="badgeText"></span>
</div>

<!--
  The answer to a press the service refused. Near the bottom rather than up by
  the badge, because the press can happen anywhere down a long page and an
  answer that appears off-screen is no answer.
-->
<div id="lockedHint" data-i18n="ui.lockedHint"></div>

<!--
  One dialog for every question this page asks.

  It replaces `confirm()`, which is not ours: the browser decides how it looks,
  what its buttons say and in which language, and the three engines this has to
  run in decide differently. Inside the packaged shell it is not even certain
  one appears at all — ⚠️ never tested there — and a confirmation that silently
  does not appear is either an action that cannot be taken or one taken without
  asking. A `<dialog>` is part of the page, so it behaves the same everywhere
  the page does.
-->
<dialog id="askDialog">
  <h3 id="askTitle"></h3>
  <div id="askBody"></div>
  <div class="row">
    <button class="chip" id="askCancel" data-i18n="ui.cancel"></button>
    <button class="chip" id="askOk"></button>
  </div>
</dialog>

<!--
  ⭐⭐ 闸门的唯一出口(2026-08-28 改形态)。

  从前:页面自己弹个框,人点了就在 argv 里加一个 `--approved`。那句「同意」是页面
  写的,而任何能 POST 到 /api/command 的东西都是这扇窗的子进程 —— 于是「有人点过头」
  退化成一句打得出来的话。现在 `--approved` 已经从命令行里删掉了。

  改成:命令行撞上闸门就在磁盘上写一条**待批请求**并等着,这扇窗把它画出来,人点
  「允许」之后由**服务端自己**去跑那条 argv。谁在等这个答案不重要 —— 另一个终端里
  的命令行、agent、还是这个页面自己按下的按钮,都走这一条路。

  ⛔ 这两个按钮不带 data-cmd:agent 开车时别的控件都置灰,而它恰恰是 agent 撞上闸门
  才出现的东西,跟着灰掉等于把闸门焊死成「永远没人点」。服务端也是这么分的
  (/api/approve 不经过 heldAgainst)。
-->
<dialog id="approveDialog">
  <h3 id="approveTitle"></h3>
  <div id="approveWhat"></div>
  <div class="row">
    <button class="chip" id="approveDeny"></button>
    <button class="chip danger" id="approveAllow"></button>
  </div>
</dialog>

<!--
  Closing this is quitting the program, not hiding a view — so it says what
  quitting costs. The warning exists because "sandbox launcher" undersells
  what this is: the sandboxes are managed from here, and someone who thinks
  they merely started them would not expect closing the window to stop them.
-->
<dialog id="quitDialog">
  <h3 data-i18n="ui.notice"></h3>
  <div id="quitWhat"></div>
  <!--
    ⛔ 「连日常档案柜一起停」那个勾没了(刀 2)。不是不给选,是这个选择换了个地方:
    `stop --all` 字面就是全部,沙箱照停,轮到日常柜那一台会撞闸门 —— 于是「停不停它」
    由上面那个闸门弹窗回答,而那个回答是真点击。留着勾就成了第二个说法,而它说了
    不算。
  -->
  <label class="check" style="margin-top:8px"><input type="checkbox" id="quitDontAsk">
    <span><b data-i18n="ui.dontAskAgain"></b><i data-i18n="ui.quitDontAskNote"></i></span></label>
  <div class="row">
    <button class="chip" id="quitCancel" data-i18n="ui.cancel"></button>
    <button class="chip danger" id="quitConfirm" data-i18n="ui.quitConfirm"></button>
  </div>
</dialog>

<script type="module">
const $ = (id) => document.getElementById(id)

// Baked in by the window when it serves this page, exactly like the pass
// below: the language is a setting of the data directory, so the page and the
// command line answering it read the same table and say the same sentences.
const LANG = '__DSH_BOX_LANG__'
const LANG_NAMES = __DSH_BOX_LANG_NAMES__
const MESSAGES = __DSH_BOX_MESSAGES__

/** Same semantics as `t` in src/messages.js: a missing key returns the key. */
function t(key, vars = {}) {
  const line = MESSAGES[key]
  if (line === undefined) return key
  return line.replaceAll(/\{(\w+)\}/g, (whole, name) => (name in vars ? String(vars[name]) : whole))
}

/** Fill every piece of static text from the table, before anything else runs. */
function applyI18n() {
  for (const element of document.querySelectorAll('[data-i18n]')) {
    element.textContent = t(element.dataset.i18n)
  }
  for (const element of document.querySelectorAll('[data-i18n-placeholder]')) {
    element.placeholder = t(element.dataset.i18nPlaceholder)
  }
  for (const element of document.querySelectorAll('[data-i18n-title]')) {
    element.title = t(element.dataset.i18nTitle)
  }
}
applyI18n()

let state = null

/**
 * 日常档案柜的名字。
 *
 * ⛔ 刀 2 之后「哪个柜子」是一个**值**,不再是 --main / --sandbox 那根二选一的轴,
 * 所以日常柜也得有个名字。它必须和命令行认的那个逐字相同(src/paths.js 的
 * DAILY_CABINET):对不上不会报错,只会安静地把每一条命令都打到一个不存在的沙箱上,
 * 而页面上看着一切正常。check-page-marks 拿真值来对它,就是为了不让这件事只靠记性。
 */
const DAILY = 'main'

/** 当前选中的档案柜,写成命令行认的那个值。`workspace === null` 就是日常柜。 */
function chosenCabinet() {
  return workspace === null ? DAILY : workspace
}

// Ends whatever is downloading, whoever started it — an agent's install is
// stopped from here exactly as a person's is, because both are the same claim
// on the same tree.
$('npmCancelBtn').onclick = async () => {
  $('npmCancelBtn').disabled = true
  try {
    const result = await run(['stop', '--download'])
    finalDownload = result.cancelled === null
      ? ''
      : `<div class="ok">${t('ui.npmCancelled', { name: escape(String(result.cancelled)) })}</div>`
    await refresh()
  } catch (error) {
    finalDownload = `<div class="err">${escape(error.message)}</div>`
  } finally {
    $('npmCancelBtn').disabled = false
    drawDownload()
  }
}

/**
 * What was on screen when the last download this window watched ended.
 *
 * ⛔ Kept in a variable rather than written straight into the element, because
 * the two-second poll redraws that element: an ending written directly would
 * survive until the next tick and no longer. Null means "nothing to say once the
 * live view goes away" — the state before the first install and after a reload.
 *
 * ⛔ Declared up here with the other page state, not beside the handler that
 * sets it: `refresh()` runs on load and calls `drawDownload`, and a `let` further
 * down the file is still in its dead zone at that moment. This file has been
 * bitten by module-level evaluation order before.
 */
let finalDownload = null
/**
 * Which machine to launch on: '' means the dsh this computer already has, and
 * any other value names a release dsh-box downloaded. Empty is not "nothing
 * chosen" — it is the choice that needs no flag, exactly as on the command
 * line, where `--version` is the only way to ask for one of ours.
 */
let version = ''
/**
 * Which workspace to open: `null` is the user's own `~/.dsh`, a string is a
 * sandbox by name. A name not among the existing sandboxes is one that will be
 * created by the launch — the same thing naming one has always done.
 */
let workspace = undefined
/**
 * Pending changes to the selected workspace's plugins, by the two flags they
 * become. Both are emptied whenever the workspace changes: they name things to
 * do *to that workspace*, and carrying them across would apply an intention
 * formed about one filing cabinet to a different one.
 */
const picked = new Set()
const dropping = new Set()

/**
 * What should happen to this cabinet's sign-in at the next start.
 *
 * `null` is "leave it alone", which is what a person who has not touched the
 * tick means — the same rule the plugin flags follow.
 */
let signInPlan = null

/** Forget pending changes; they belonged to the cabinet being left. */
function switchCabinet(next) {
  if (next === workspace) return
  workspace = next
  picked.clear()
  dropping.clear()
  signInPlan = null
}

// Served into the page by the window itself; a page from anywhere else
// cannot read it, and without it the service answers nothing.
const PASS = '__DSH_BOX_PASS__'

async function api(path, body) {
  const response = await fetch(path, body === undefined
    ? { headers: { 'x-dsh-box-pass': PASS } }
    : {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-dsh-box-pass': PASS },
      body: JSON.stringify(body),
    })
  const data = await response.json()
  if (!response.ok) {
    // The window mints a new pass every time it starts, and this page carries
    // the one it was served with. So a refused pass means one thing only: the
    // window was restarted and this tab belongs to the previous run. Nothing
    // here is broken and nothing needs deciding — the page just needs to be the
    // current one, so it reloads itself.
    //
    // ⭐ Exactly once per episode, never in a loop. The reload is only attempted
    // if none was attempted in the last half minute; if one was, then reloading
    // did not fix it, and repeating something that just failed is how a page
    // ends up refreshing itself forever. It says so instead and stops.
    if (data.code === 'STALE_PASS') {
      const lastTry = Number(sessionStorage.getItem(RELOADED) ?? 0)
      if (Date.now() - lastTry > 30000) {
        sessionStorage.setItem(RELOADED, String(Date.now()))
        location.reload()
      } else {
        stopPolling()
        document.body.insertAdjacentHTML('afterbegin', `<div class="err">${t('ui.staleStuck')}</div>`)
      }
    }
    // The refusal travels whole, code included, so a caller can recognise
    // *what* was refused instead of matching words that change with the
    // language.
    const failure = new Error(data.error ?? t('ui.requestFailed', { status: response.status }))
    failure.result = data
    throw failure
  }
  return data
}

/** When this tab last reloaded itself to pick up a new pass. */
const RELOADED = 'dsh-box-pass-reload'

/**
 * Do something, by running the command that does it.
 *
 * Every button on this page ends up here. Nothing is "the window's version" of
 * an action any more: the same words, in the same order, that a person or an
 * agent would type get run, and what comes back is what they would have seen.
 * That is what keeps this window from being able to do anything the command
 * line cannot — and what puts every click in the same journal.
 *
 * Which buttons map to which command lives here, in the window, on purpose:
 * control names are the window's business and the command line has no reason
 * to know them.
 */
async function run(argv) {
  const result = await api('/api/command', { argv })
  // ⭐ Who may send a command while an agent drives is decided by the service,
  // not here. The window's part is to say what happened, in one line, near where
  // the press was — an error box would be over-reacting to something that is
  // not a fault.
  if (result.code === 'AGENT_HOLDS_WINDOW') {
    sayLocked()
    const held = new Error(result.message)
    held.result = result
    throw held
  }
  if (result.ok !== true) {
    // The whole refusal is carried along, not just its sentence: the `code` is
    // the part that does not change, and a refusal often brings the one fact
    // that answers it (a naming rule, the sandbox that is in the way). Throwing
    // the message alone would make the window paraphrase what it was told.
    const refusal = new Error(result.message ?? t('ui.commandFailed', { code: result.code ?? t('ui.unknown') }))
    refusal.result = result
    throw refusal
  }
  return result
}

/**
 * Ask a yes/no question, in a dialog this page owns.
 *
 * Returns a promise so callers read the same as they did with `confirm()`,
 * without any of them depending on the browser to provide a modal.
 * @param {{title: string, body: string, ok?: string, danger?: boolean}} question
 * @returns {Promise<boolean>}
 */
function ask({ title, body, ok = t('ui.ok'), danger = false }) {
  $('askTitle').textContent = title
  $('askBody').innerHTML = body
  $('askOk').textContent = ok
  $('askOk').className = danger ? 'chip danger' : 'chip'
  $('askDialog').showModal()
  return new Promise((resolve) => {
    const done = (answer) => {
      $('askDialog').close()
      $('askOk').onclick = null
      $('askCancel').onclick = null
      resolve(answer)
    }
    $('askOk').onclick = () => done(true)
    $('askCancel').onclick = () => done(false)
    // Esc closes a dialog without either button; that is a "no".
    $('askDialog').addEventListener('close', () => resolve(false), { once: true })
  })
}

async function refresh() {
  state = await api('/api/state')
  // Dropped on the first answer and never put back: later polls redraw a page
  // that already has something on it, and a spinner reappearing every two
  // seconds would be worse than the wait it was added for.
  document.querySelector('main')?.classList.remove('booting')
  // With no dsh installed on this machine there is no default machine either,
  // so a download has to be picked before anything can start.
  if (version === '' && state.host?.found !== true) {
    version = state.last.version || state.downloaded[0]?.version || ''
  }
  // Never starts out on the daily workspace: that is the one choice with a cost
  // that outlives the launch, and a default is something people press without
  // reading. Falls back to the last sandbox used, then to any that exists.
  if (workspace === undefined) {
    const remembered = state.sandboxes.find((box) => box.name === state.last.sandbox)
    switchCabinet((remembered ?? state.sandboxes[0])?.name ?? state.suggestedName)
  }
  // ⛔ Nothing is seeded from `last` any more, and that is the point: what a
  // workspace has is a fact about the workspace, read back above, not a
  // selection remembered from the previous launch. Seeding used to make the
  // window quietly re-tick things — once badly enough that a leftover id no
  // longer in the registry rode along on every launch, invisible, failing three
  // of them while the tick the user had just made looked like the culprit.
  const known = new Set([...state.plugins, ...state.missingPlugins].map((plugin) => plugin.id))
  for (const id of [...picked]) if (!known.has(id)) picked.delete(id)
  // ⛔ The sign-in tick used to be seeded here from `last`, contradicting the
  // paragraph above in the same breath. It was harmless only by accident —
  // `drawSignIn` overwrites it one line below — but it is exactly the shape a
  // person reports as "it ticks itself on", so it is gone rather than explained.
  $('boxPath').textContent = t('ui.boxPath', { box: state.box })
  drawVersions(); drawPlugins(); drawRunning(); drawWorkspaces(); drawStartButton(); drawDownload(); drawApprovals()
  // Last, because the frames are drawn onto the controls the lines above just
  // rebuilt.
  drawAgent()
}

/** How a pin check should be worded, in the three states it really has. */
function pinWords(host) {
  if (!host.verified) return t('status.hostUnverified')
  if (host.pinned) return t('status.hostPinned', { count: host.packages })
  return t('status.hostMixed', { list: host.mixed.map((w) => `${w.name}@${w.found ?? t('status.versionUnknown')}`).join('、') })
}

function drawRunning() {
  const list = state.running ?? []
  // The main environment sits in the same list, because it is the same kind of
  // thing: a dsh this tool started and can stop. What differs is only that it
  // is not a sandbox — it is the user's own home — so it says so and never
  // offers deletion.
  const rows = [
    ...(state.main === null || state.main === undefined ? [] : [{ ...state.main, isMain: true }]),
    ...list,
  ]
  $('runningCard').hidden = rows.length === 0
  // ⛔⛔ 上一次启动的那条绿色横幅,在它说的那台不再运行时必须当场作废。
  //
  // ⭐ 判词:**结果提示是有保质期的断言,状态一变就不再成立。** 实测撞到过——
  // 沙箱停掉之后按钮已经变回「启动沙箱」(控件是对的),而下面那条横幅仍写着
  // 「已启动」并挂着一个 `打开 http://127.0.0.1:3090` 的链接,那个地址此刻没人在听。
  // ⛔ 这一条正踩在两道页面守卫的盲区上:它们查的是**控件**跟不跟状态,而这里
  // 控件是对的,错的是**结果横幅**。所以清除写在这儿——和画列表同一个漏斗,
  // 新增的横幅白白继承,不必谁记得再加一次。
  const banner = $('startOut')
  const about = banner.dataset.about
  if (about !== undefined && about !== ''
    && !rows.some((r) => (r.isMain === true ? 'main' : r.sandbox) === about)) {
    banner.innerHTML = ''
    delete banner.dataset.about
  }
  const host = $('running')
  host.innerHTML = ''
  for (const r of rows) {
    const row = document.createElement('div')
    row.className = 'item'
    row.dataset.mark = r.isMain ? 'run:main' : `run:${r.sandbox}`
    const label = r.isMain ? escape(t('ui.dailyCabinet')) : escape(r.sandbox)
    const note = r.isMain ? ` · ${escape(t('ui.runMainNote'))}` : ''
    // Which machine, not just which number: the same version string can be two
    // different installations, and on the real home the difference is the whole
    // question of whether this launch leaves anything behind.
    const machine = r.engine === undefined ? ''
      : ` · ${escape(t(r.engine.kind === 'host' ? 'ui.engineHost' : 'ui.engineRelease'))}`
    row.innerHTML = `<div><b>${label}</b>
      <em>${escape(r.version ?? '')}${machine}${note} · <a href="${r.url}" target="_blank" rel="noreferrer">${escape(r.url)}</a></em></div>`
    const halt = document.createElement('button')
    halt.className = 'mini'; halt.dataset.cmd = ''; halt.textContent = t('ui.stop')
    halt.onclick = async () => {
      // 停日常柜那一台要人点头,而点头的地方就是这扇窗:命令行会写一条待批请求,
      // 上面的弹窗把它画出来。这里不必分两条路,argv 只是柜子的名字不同。
      await run(['stop', r.isMain ? DAILY : r.sandbox])
      await refresh()
    }
    row.append(halt)
    host.append(row)
  }
}

/**
 * The folders this box has been pointed at, worked out rather than stored.
 *
 * ⭐ Every sandbox already records which installation last booted it, so the
 * list of named folders is a consequence of what has been run — not a second
 * thing to keep in step with it. Nothing is registered, so nothing can go
 * stale, and there is no list to delete from.
 * ⚠️ The one being chosen right now is included even though no sandbox has used
 * it yet: otherwise pasting a folder would select a chip that is not there.
 */
function namedEngines() {
  const seen = new Map()
  // ⛔ Ordered by when each was last used, and by nothing else. Selecting is
  // not using: an order that also depended on what is currently picked made a
  // chip jump to the front of the row the moment it was clicked — the control
  // moved out from under the pointer, and the one now under the pointer was a
  // different machine.
  const used = (state.sandboxes ?? [])
    .filter((box) => box.lastEngine !== null && box.lastEngine !== undefined
      && (box.lastEngine.kind === 'tree' || box.lastEngine.kind === 'app'))
    .sort((a, b) => String(b.lastUsed ?? '').localeCompare(String(a.lastUsed ?? '')))
  for (const box of used) {
    if (!seen.has(box.lastEngine.dir)) {
      seen.set(box.lastEngine.dir, { dir: box.lastEngine.dir, version: box.lastEngine.version ?? null })
    }
  }
  // ⚠️ Appended, never inserted: one that has just been pasted has never been
  // used, so it belongs after everything that has. It moves into the ordering
  // above the first time it actually starts something.
  if (typeof version === 'string' && /[\\/]/.test(version) && !seen.has(version)) {
    seen.set(version, { dir: version, version: null })
  }
  return [...seen.values()]
}

function drawVersions() {
  const have = new Map(state.downloaded.map((d) => [d.version, d]))
  // Main row: every release from the featured cut to the newest, plus
  // anything already downloaded (a downloaded early build is actionable and
  // should not hide in the fold).
  const offered = [...new Set([...state.featured, ...state.downloaded.map((d) => d.version)])]
  const chip = (v) => {
    const local = have.get(v)
    const button = document.createElement('button')
    button.className = 'chip'
    button.setAttribute('aria-pressed', String(v === version))
    const size = local?.sizeMb != null ? ` · ${local.sizeMb} MB` : ''
    const newest = v === state.featured?.[0] ? ' · newest' : ''
    const label = (local === undefined ? t('ui.notDownloaded')
      : local.pinned ? `${t('ui.pinnedShort', { count: local.packages })}${size}` : t('ui.mixedShort')) + newest
    button.innerHTML = `${v}<small>${label}</small>`
    button.dataset.mark = `machine:${v}`
    button.onclick = () => { version = v; drawVersions() }
    if (local !== undefined) {
      button.style.paddingRight = '26px'
      const x = document.createElement('span')
      x.className = 'x'; x.textContent = '×'; x.title = t('ui.deleteVersionTitle')
      // ⛔ It sends a command, so it greys out with the rest while an agent
      // drives. It was missed for the same reason every miss in this scheme
      // happens: the marking is per control, and this one is a span bolted onto
      // another control rather than a button of its own.
      x.dataset.cmd = ''
      x.onclick = async (event) => {
        event.stopPropagation()
        if (!await ask({
          // Titles are set as text, so they must not arrive pre-escaped.
          title: t('ui.deleteVersionAsk', { version: v }),
          body: `<p>${t('ui.deleteVersionBody')}</p>`,
          ok: t('ui.delete'), danger: true,
        })) return
        try {
          await watchLog($('pullOut'), ['logs', '--version', v], t('ui.deletingHead', { version: escape(v) }),
            run(['rm', 'machine', v]))
          if (version === v) version = ''
          $('pullOut').innerHTML = `<div class="ok">${t('ui.deletedMsg', { version: escape(v) })}</div>`
          await refresh()
        } catch (error) {
          $('pullOut').innerHTML = `<div class="err">${escape(error.message)}</div>`
        }
      }
      button.append(x)
    }
    return button
  }
  $('versions').innerHTML = ''
  // The machine already on this computer comes first and is the ordinary
  // answer: it may be a build the user modified, and nothing we download can
  // stand in for that. The downloads after it are for trying another release.
  const host = state.host ?? { found: false }
  if (host.found) {
    const mine = document.createElement('button')
    mine.className = 'chip native'
    mine.setAttribute('aria-pressed', String(version === ''))
    mine.innerHTML = `${t('ui.hostChip', { version: escape(host.version) })}<small>${escape(pinWords(host))}</small>`
    // The empty key: "the machine this computer has" is what no `--version` means.
    mine.dataset.mark = 'machine:'
    mine.onclick = () => { version = ''; drawVersions() }
    $('versions').append(mine)
  }
  $('machineHint').textContent = t(host.found ? 'ui.machineHintHost' : 'ui.machineHintNoHost')
  // Folders somebody named, in the same row because they are the same axis.
  // Cream for the same reason the machine above is cream: this is theirs, not
  // a copy we made.
  for (const named of namedEngines()) {
    const button = document.createElement('button')
    button.className = 'chip native'
    button.setAttribute('aria-pressed', String(named.dir === version))
    const where = named.dir.split(/[\\/]/).filter(Boolean).pop() ?? named.dir
    const what = named.version === null || named.version === undefined
      ? t('ui.pathChipUnstarted')
      : escape(named.version)
    button.innerHTML = `${escape(where)}<small>${what}</small>`
    button.title = named.dir
    // ⭐ The same key the command line emits: a folder rides `--version`, so a
    // launch on one lights this chip with no extra wiring anywhere.
    button.dataset.mark = `machine:${named.dir}`
    button.onclick = () => { version = named.dir; drawVersions() }
    // The same x as on a download, and deliberately: one rule, learned once —
    // "take it out of here", and what happens depends on whose it is.
    // The question has to say so out loud, though. On a download this same
    // symbol deletes a quarter of a gigabyte; here it deletes nothing of
    // theirs, and whoever learned the first meaning first will assume it does.
    button.style.paddingRight = '26px'
    const forgetX = document.createElement('span')
    forgetX.className = 'x'
    forgetX.textContent = '×'
    forgetX.title = t('ui.forgetTitle')
    forgetX.dataset.cmd = ''
    forgetX.onclick = async (event) => {
      event.stopPropagation()
      if (!await ask({
        title: t('ui.forgetAsk', { where }),
        body: `<p>${t('ui.forgetBody', { path: escape(named.dir) })}</p>`,
        ok: t('ui.forget'),
      })) return
      try {
        await run(['rm', 'machine', named.dir])
        if (version === named.dir) version = ''
        $('pullOut').innerHTML = `<div class="ok">${t('ui.forgotMsg', { path: escape(named.dir) })}</div>`
        await refresh()
      } catch (error) {
        $('pullOut').innerHTML = `<div class="err">${escape(error.message)}</div>`
      }
    }
    button.append(forgetX)
    $('versions').append(button)
  }
  for (const v of offered) $('versions').append(chip(v))
  const older = (state.older ?? []).filter((v) => !have.has(v))
  $('olderWrap').hidden = older.length === 0
  $('olderVersions').innerHTML = ''
  for (const v of older) $('olderVersions').append(chip(v))
  $('source').value = state.source ?? 'auto'
}

/** What the selected workspace has registered right now. */
function installedHere() {
  const empty = { ours: [], theirs: [], platform: [], readable: true }
  if (workspace === null) return state.mainPlugins ?? empty
  return state.sandboxes.find((entry) => entry.name === workspace)?.plugins ?? empty
}

/**
 * The selected workspace's plugins, in three states.
 *
 * This card used to ask "which plugins should this launch carry", which was a
 * question about the launch. It is now a question about the workspace: what it
 * has, what will be added, what will be taken away. All three stay pending
 * until the start button — like the machine and the workspace above it — so
 * nothing on this card changes anything by itself.
 */
function drawPlugins() {
  const host = $('plugins')
  host.innerHTML = ''
  const here = installedHere()
  const already = new Set([...here.ours.map((entry) => entry.package), ...here.theirs])

  $('pluginHint').textContent = t(workspace === null ? 'ui.pluginHintMain' : 'ui.pluginHintSandbox')
  if (here.readable === false) {
    host.insertAdjacentHTML('beforeend', `<div class="warn">${t('ui.unreadableWarn')}</div>`)
  }

  const row = ({ title, note, tick, tag, mark, checked, disabled = false, onchange, keys }) => {
    const label = document.createElement('label')
    label.className = `check${mark === 'going' ? ' going' : ''}`
    if (keys !== undefined) label.dataset.mark = keys
    label.innerHTML = `<input type="checkbox" class="tick ${tick}"${disabled ? ' disabled' : ''}>
      <span><b>${escape(title)}</b><span class="tag ${mark}">${escape(tag)}</span><i>${escape(note)}</i></span>`
    const box = label.querySelector('input')
    box.checked = checked
    if (!disabled) box.onchange = onchange
    host.append(label)
    return label
  }

  // What this workspace already has, by our hand: ticked green. Unticking it
  // schedules a removal rather than performing one — the start button is where
  // everything on this page becomes true.
  for (const entry of here.ours) {
    const going = dropping.has(entry.package)
    row({
      // The version rides on the name when the folder answers with one — read
      // off disk by the service at every snapshot, never stored. No version is
      // shown as nothing at all: a placeholder would read as a fact.
      title: entry.version == null ? entry.package : `${entry.package} ${entry.version}`,
      note: going ? t('ui.willRemoveNote') : (entry.path ?? t('ui.installedHereNote')),
      tick: 'have',
      tag: going ? t('ui.tagGoing') : t('ui.tagHave'),
      mark: going ? 'going' : 'have',
      checked: !going,
      // Both, because a record may name it either way: `--plugin` takes the id
      // this tool registered it under, `--unplug` takes the package name.
      keys: `plugin:${entry.id} plugin:${entry.package}`,
      onchange: (event) => {
        if (event.target.checked) dropping.delete(entry.package); else dropping.add(entry.package)
        drawPlugins()
      },
    })
  }

  // What it had before we ever touched it. Shown because this card should say
  // what dsh will load, not only what this tool put there; not touchable,
  // because removing something we did not add is not ours to do.
  for (const name of here.theirs) {
    row({
      title: name,
      note: t('ui.theirsNote'),
      tick: 'have',
      tag: t('ui.tagTheirs'),
      mark: 'theirs',
      checked: true,
      disabled: true,
    })
  }

  // The registry: what this tool knows about and this workspace does not have.
  //
  // ⛔ 每一行原来右边还挂着一个「不再记 / 卸载并删除」,它发的是 `plugins rm` ——
  // **刀 1(44daa49)把登记表这个对象整个删掉了**,那条命令一起没了,新形状里没有
  // 替代品:`rm plugin <id> --from <柜>` 只管一个柜子,而这个按钮的意思是「从所有
  // 柜子弄走」。要不要给 `--everywhere` 是 check-command-map.mjs 里 plugins.rm 那格
  // 记着的**未决问题**,不是这里能顺手发明的,所以按钮删掉。
  // ⭐ 从一个柜子里拿掉插件这件事页面并没有丢:取消勾选那一行,按启动 —— 走的是
  // `start --unplug`。
  for (const plugin of state.plugins.filter((entry) => !already.has(entry.package))) {
    row({
      title: plugin.version == null ? plugin.label : `${plugin.label} ${plugin.version}`,
      note: plugin.path,
      tick: 'add',
      tag: picked.has(plugin.id) ? t('ui.tagAdd') : t('ui.tagNot'),
      mark: picked.has(plugin.id) ? 'add' : 'going',
      checked: picked.has(plugin.id),
      keys: `plugin:${plugin.id} plugin:${plugin.package}`,
      onchange: (event) => {
        if (event.target.checked) picked.add(plugin.id); else picked.delete(plugin.id)
        drawPlugins()
      },
    })
  }

  for (const plugin of state.missingPlugins) {
    const line = document.createElement('p')
    line.className = 'sub'
    line.style.margin = '4px 0'
    line.textContent = t('ui.missingPlugin', { label: plugin.label })
    host.append(line)
  }

  if (host.children.length === 0) {
    host.innerHTML = `<p class="sub" style="margin:0">${t('ui.noPlugins')}</p>`
  }
}

/**
 * The workspace axis: which `DSH_HOME` to open.
 *
 * Drawn as the machine row is drawn, because it is the same kind of question
 * and knife 4 has to highlight both the same way. The daily workspace is one of
 * the choices rather than a separate card: to the launcher it is simply another
 * home, and the only thing that makes it different — that it is the user's own
 * and cannot be deleted — is said by its colour and by the absence of a delete.
 */
function drawWorkspaces() {
  const row = $('workspaces')
  row.innerHTML = ''
  const chip = (label, note, selected, className = 'chip') => {
    const button = document.createElement('button')
    button.className = className
    button.setAttribute('aria-pressed', String(selected))
    button.innerHTML = `${escape(label)}<small>${escape(note)}</small>`
    return button
  }

  const daily = chip(t('ui.dailyCabinet'), t('ui.dailyNote'), workspace === null, 'chip native')
  daily.dataset.mark = 'cabinet:main'
  daily.onclick = () => { switchCabinet(null); drawWorkspaces(); drawPlugins(); drawStartButton() }
  row.append(daily)

  for (const box of state.sandboxes) {
    const note = [
      box.lastVersion
        ? `${t('ui.lastVersion', { version: box.lastVersion })}${box.lastEngine?.kind === 'host' ? t('ui.hostSuffix') : ''}`
        : t('sandbox.neverStarted'),
      t('sessions.count', { count: box.sessions }),
    ].join(' · ')
    const button = chip(box.name, note, workspace === box.name)
    button.dataset.mark = `cabinet:${box.name}`
    button.onclick = () => { switchCabinet(box.name); drawWorkspaces(); drawPlugins(); drawStartButton() }
    row.append(button)
  }

  // A name typed but not yet created shows as a choice too, so the selection is
  // never something invisible.
  if (typeof workspace === 'string' && !state.sandboxes.some((box) => box.name === workspace)) {
    const fresh = chip(workspace, t('ui.freshNote'), true)
    fresh.onclick = () => {}
    row.append(fresh)
  }

  $('workspaceHint').textContent = t(workspace === null ? 'ui.cabinetHintMain' : 'ui.cabinetHintSandbox')
  drawSignIn()
  drawWorkspaceDetail()
}

/**
 * What this cabinet's sign-in is, and what is about to happen to it.
 *
 * ⭐ Read off the disk, like a plugin row, rather than remembered from the last
 * launch — a sign-in is a fact about a cabinet, not a preference of this run.
 * The colours mean what they mean on the plugin rows: green is *has*, blue is
 * *will get*, struck through is *about to lose*. Nothing happens until the start
 * button, which is where everything on this page becomes true.
 *
 * ⛔ The daily cabinet's tick is shown too, and it can be taken out — a door
 * this tool deliberately opened (CEO 2026-08-23), because `adopt` and the
 * plugin rows already reach into that cabinet. It is the only one of the three
 * that cannot be undone: no backup is kept, on purpose.
 */
function drawSignIn() {
  const wrap = $('signInWrap')
  const tick = $('importSignIn')
  const box = state.sandboxes.find((entry) => entry.name === workspace)
  // A name typed but not created yet: there is no fact to read, only the choice
  // of what the cabinet should be born with.
  const unborn = typeof workspace === 'string' && box === undefined
  const signedIn = workspace === null ? state.mainSignedIn === true : box?.hasCredentials === true

  wrap.hidden = false
  wrap.classList.toggle('going', !unborn && signedIn && signInPlan === false)
  tick.className = `tick ${unborn || !signedIn ? 'add' : 'have'}`
  tick.checked = unborn ? signInPlan !== false : (signInPlan === null ? signedIn : signInPlan)
  $('signInTag').className = `tag ${unborn ? 'add' : signedIn ? (signInPlan === false ? 'going' : 'have') : 'add'}`
  $('signInTag').textContent = unborn ? t('ui.signInWillImport')
    : signedIn ? t(signInPlan === false ? 'ui.signInGoing' : 'ui.signInHave')
      : t(signInPlan === true ? 'ui.signInWillImport' : 'ui.signInNone')
  $('signInNote').textContent = unborn ? t('ui.importSignInNote')
    : workspace === null ? t('ui.signInDailyNote') : t('ui.signInSandboxNote')

  tick.onchange = () => {
    if (unborn) signInPlan = tick.checked ? null : false
    else if (signedIn) signInPlan = tick.checked ? null : false
    else signInPlan = tick.checked ? true : null
    drawSignIn()
    drawStartButton()
  }
}

/** What can be done to the selected workspace, other than starting it. */
function drawWorkspaceDetail() {
  const detail = $('workspaceDetail')
  detail.innerHTML = ''
  const box = state.sandboxes.find((entry) => entry.name === workspace)
  if (box === undefined) return

  const line = document.createElement('div')
  line.className = 'item'
  line.innerHTML = `<em>${escape(t(box.hasCredentials ? 'sandboxes.signedIn' : 'sandboxes.notSignedIn'))} · ${escape(box.home)}</em>`

  const adopt = document.createElement('button')
  adopt.className = 'mini'
  adopt.dataset.cmd = ''
  adopt.dataset.mark = 'go:adopt'
  adopt.textContent = t('ui.adoptBtn')
  adopt.disabled = box.sessions === 0
  adopt.onclick = async () => {
    if (!await ask({
      title: t('ui.adoptAskTitle'),
      body: `<p>${t('ui.adoptAskBody', { name: escape(box.name), sessions: box.sessions })}</p>`
        + `<p class="sub" style="margin:0">${t('ui.adoptAskNote')}</p>`,
      ok: t('ui.adoptOk'),
    })) return
    try {
      // ⭐ 方向从此是两个值,不是一个功能:这个按钮固定「这台沙箱 → 日常档案柜」,
      // 反向与任意两柜之间同一条命令换个旗标就成(check-page-marks 的 cliOnly 记着)。
      const result = await run(['get', 'chat', '--from', box.name, '--to', DAILY])
      $('adoptOut').innerHTML = `<div class="ok">${t('ui.adoptDone', { adopted: result.adopted, skipped: result.skipped })}</div>`
    } catch (error) {
      $('adoptOut').innerHTML = `<div class="err">${escape(error.message)}</div>`
    }
  }

  const drop = document.createElement('button')
  drop.className = 'mini'
  drop.dataset.cmd = ''
  drop.textContent = t('ui.deleteSandboxBtn')
  drop.onclick = async () => {
    if (!await ask({
      title: t('ui.deleteSandboxAsk', { name: box.name }),
      body: `<p>${t('ui.deleteSandboxBody', { sessions: box.sessions })}</p>`,
      ok: t('ui.delete'), danger: true,
    })) return
    try {
      await run(['rm', 'sandbox', box.name])
      // Back to "no choice made", so the next refresh picks another sandbox.
      // Falling to the daily workspace here would quietly select the one option
      // that must never be selected by accident.
      switchCabinet(undefined)
    } catch (error) {
      // A running sandbox is refused by the command, as it is for everyone
      // else. The window used to delete it anyway and say nothing.
      $('adoptOut').innerHTML = `<div class="err">${escape(error.message)}</div>`
    }
    await refresh()
  }

  const actions = document.createElement('div')
  actions.append(adopt, drop)
  line.append(actions)
  detail.append(line)
}

/**
 * One button, whose words follow the workspace that is selected.
 *
 * Opening the daily workspace is not a different feature — it is this same
 * launch with a different home, which is exactly what the command line says:
 * one positional, and the daily cabinet's value is its name. Two buttons
 * implied two mechanisms.
 */
function drawStartButton() {
  const button = $('startBtn')
  button.textContent = t(workspace === null ? 'ui.startMain' : 'ui.startSandbox')
  button.className = workspace === null ? 'go mine' : 'go'
}

/**
 * Which *options* a recorded action touched.
 *
 * ⛔ Options, not cards. The first version of this named whole regions — the
 * version row, the plugin card — so a launch that chose one release out of six
 * put a frame around all six. A frame that says "command ① happened somewhere
 * in here" is barely more than the badge already says; the point of drawing on
 * the page at all is to point at the thing.
 *
 * So every drawable choice carries a key in `data-mark`, and this turns one
 * recorded action into the keys it touched. An element may carry several keys
 * separated by spaces — a plugin row answers to both its id and its package
 * name, because a record may name it either way.
 *
 * ⭐ The keys live in the window and nowhere else. The command line records
 * semantic actions and has no business knowing that a release is picked from a
 * row of chips.
 * @param {{command: string, args?: Record<string, any>}} action
 * @returns {string[]}
 */
function markKeys(action) {
  const args = action.args ?? {}
  // The empty machine key is not "nothing chosen": it is the computer's own
  // dsh, which is a real chip on the page and the answer that needs no flag.
  const machine = `machine:${args.version ?? ''}`
  // ⛔ 读法跟着刀 2 走:柜子是一个**值**,可能记在 sandbox / in / to / from 任意一
  // 格里(取决于这条记录是命令刚开始时写下的,还是跑完之后重写的),而日常柜的值
  // 就是它的名字。和 src/commands.js 的 cabinetOf 同一套读法,少读一格的后果是
  // 这一步的框整个落空 —— 而落空是安静的。
  const cabinetOf = (from) => {
    if (from.main === true) return DAILY
    const named = from.sandbox ?? from.in ?? from.to ?? from.from
    return named === null || named === undefined ? null : String(named)
  }
  const here = cabinetOf(args)
  const workspace = here === null ? null : `cabinet:${here}`
  const named = (value) => (value === null || value === undefined ? `cabinet:${DAILY}` : `cabinet:${value}`)
  switch (action.command) {
    case 'start':
      return [
        machine,
        workspace,
        ...(args.plugins ?? []).map((id) => `plugin:${id}`),
        ...(args.unplugged ?? []).map((name) => `plugin:${name}`),
        // Sign-in is a choice of the launch like any other, and the checkbox is
        // where a person makes it — but only for a sandbox. The daily cabinet's
        // sign-in is the user's own; nothing is imported and nothing is chosen.
        ...(here === DAILY ? [] : ['go:signIn']),
        'go:start',
      ]
    case 'get.machine':
      return [machine, 'go:pull']
    case 'rm.machine':
      // Only the chip. The × that deletes a release lives inside it, so the
      // frame already covers the control; lighting the download button as well
      // would point at the opposite action.
      return [machine]
    case 'get.plugin':
      // ⭐ Two homes now: the npm box for a package name, and the folder box
      // for a directory — both end in the same command, so both light up.
      // The npm box and its button are this command's home on the page. Like
      // `get chat`, they light for every install — including one the window
      // could not have made (a local folder, `--to main`): the frame says where
      // the command lives, not that a person could have clicked it.
      return [`plugin:${args.id ?? args.target}`, workspace, 'go:npmName', 'go:npmInstall', 'go:pluginDir', 'go:addPlugin']
    case 'rm.plugin':
      return [`plugin:${args.id ?? args.target}`, workspace]
    // ⭐ 开关一行 / 撤销这一柜的插件配置。页面上没有做这件事的控件(见 DECISIONS),
    // 但它落在**哪一行、哪一个柜子**上是画得出来的 —— 框说的是「这一步发生在这里」,
    // 从来不是「这里有个按钮」。
    case 'set.plugin':
      return args.undo === true ? [workspace] : [`plugin:${args.id ?? args.target}`, workspace]
    case 'get.signin': case 'rm.signin':
      // One control for both directions, and the cabinet it belongs to. The
      // agent may have used the standalone verb while the window only offers it
      // through the tick — same place on the page either way.
      return [named(here), 'go:signIn']
    case 'set.source':
      return ['go:source']
    // ⭐⭐ 四种「停」收进一条命令,于是这里也是一条:停哪一样东西,就点亮做那件事的
    // 那个控件。⛔ 不是二选一 —— `stop --all` 停的是一串沙箱,那一串每台都该亮,
    // 而它同时也是退出按钮做的事。
    case 'stop':
      return [
        ...(args.download === true ? ['go:npmCancel'] : []),
        ...(args.all === true ? ['go:quit'] : []),
        ...(args.stopped ?? []).map((name) => `run:${name}`),
        // 只有 --all 那一路要单独说日常柜:它没有位置参数,停没停成只写在 main 上。
        ...(args.all === true && args.main === true ? [`run:${DAILY}`] : []),
        ...(args.all !== true && args.window !== true && args.download !== true && here !== null
          ? [`run:${here}`] : []),
      ]
    case 'rm.sandbox':
      return [workspace]
    case 'get.chat':
      // Both cabinets, and the button. ⚠️ The button is one fixed direction —
      // this sandbox into the daily cabinet — while the command runs between
      // any two. So an agent copying the other way still lights the two
      // cabinets, and lights a button that could not have done it: the frame
      // says where it happened, not that a person could have pressed it.
      return [named(args.fromSandbox), named(args.toSandbox), 'go:adopt']
    default:
      // No option of its own: the pale frame and the badge are its whole
      // appearance, which is the original design and not a gap.
      return []
  }
}

/**
 * A command's number, as the tag on its frames shows it.
 *
 * Plain digits (CEO 2026-08-22). The circled ones ran out at twenty and were
 * smaller to read for nothing in return — the tag is already a coloured pill,
 * so nothing else has to announce that it is a number.
 */
function seqMark(seq) {
  return String(seq)
}

/**
 * Everything about somebody else working in here, drawn from the two files.
 *
 * Both absent is the common case and means "nothing is running out there, and
 * nothing has happened yet" — the ordinary state, drawn as the ordinary window.
 *
 * ⭐⭐ `state.agent` is no longer a declaration somebody made. It is the set of
 * commands running against this data directory at this instant that this window
 * did not start, so the frame appears whether or not whoever is working was
 * polite enough to announce themselves — and disappears on its own when their
 * command ends, because the record is the process.
 */
function drawAgent() {
  const held = state?.agent ?? null
  const session = state?.session ?? null
  document.body.classList.toggle('agent', held !== null)
  // ⛔ No longer `inert`, and that reversal is the point of this whole control
  // (CEO 2026-08-22: a blanket overlay was too blunt — refuse the command
  // when it is sent instead). Locking the page locked things that were never
  // dangerous — the running dsh's own address, the folds, the list below, even
  // scrolling and copying a path — and the address is exactly what a person
  // wants next after watching an agent start something.
  //
  // ⭐ What replaced it is a refusal in the service, which is a stronger
  // guarantee rather than a looser one: the old lock was a property of the page
  // being correct, so a control the page forgot to cover was a control that
  // wrote. Now nothing the window sends gets through, whoever asked.
  //
  // ⚠️ The dimming below is therefore cosmetic. If a control is marked wrongly
  // the worst case is that it looks usable and answers with a sentence — a
  // mistake that can no longer become damage.
  document.querySelectorAll('[data-cmd]').forEach((control) => {
    control.classList.toggle('held', held !== null)
  })
  drawBadge(held)
  // ⭐ Recall first, because whether the panel is open is what decides whether
  // there are frames to draw at all.
  drawRecall(held, session)
  // ⭐ "Something is happening right now" is the whole test — there is no session
  // id to match against any more, because the trail is one rolling record of this
  // data directory rather than one agent's run.
  const live = held !== null
  // ⭐⭐ Reviewing draws frames too (CEO 2026-08-23: 「记忆就是为了看蓝框」). It is
  // not a replay — the page is still now, and a control's *value* is today's
  // value. A frame says "this step happened here", never "here is what it
  // looked like". While something is running, everything so far is lit at once,
  // which is what a person watching sees; in review, clicking a step limits the
  // frames to that step and everything before it.
  const reviewing = held === null && session !== null && recallFolded === false
  drawMarks(live ? session : (reviewing ? session : null), live ? null : reviewUpTo)
}

/** Whether the person has folded the panel away by hand this run. */
let recallFolded = null

/**
 * The step being looked at in review, or null for "all of them".
 *
 * Frames accumulate the way they did while it happened: looking at step 6 shows
 * ①–⑥, not ⑥ alone. Anything else would be a different picture from the one the
 * person would have seen live, and this panel exists to give that picture back.
 */
let reviewUpTo = null

/**
 * The list of steps, below the page rather than over it.
 *
 * ⭐ Two states, and which one it is in follows from what the panel is for. While
 * an agent drives it is **open and keeping up**, because that is the moment the
 * question "what is it doing to my settings" is being asked — and it is the only
 * place the steps with no control to frame (`status`, `logs`, `memory`) can be
 * seen at all. Once the run ends it folds to one line: the frames go, the window
 * goes back to being a window, and the record stays a click away.
 *
 * ⚠️ A fold done by hand is remembered for the length of the run and forgotten
 * with it — otherwise the next run would start folded because of something the
 * person did to a different one.
 */
function drawRecall(held, session) {
  const live = held !== null
  const shown = session
  const steps = shown?.actions ?? []
  if (steps.length === 0) {
    recallFolded = null
    $('recallPanel').hidden = true
    return
  }
  $('recallPanel').hidden = false
  if (recallFolded === null) recallFolded = !live
  const open = !recallFolded
  $('recallToggle').textContent = live
    ? t(open ? 'ui.recallLiveOpen' : 'ui.recallLiveClosed', { count: steps.length })
    : t(open ? 'ui.recallPastOpen' : 'ui.recallPastClosed', { count: steps.length })
  $('recallToggle').setAttribute('aria-expanded', String(open))
  $('recallBody').hidden = !open
  if (!open) reviewUpTo = null
  if (!open) return
  $('recallBody').innerHTML = recallRows(shown, live)
  // ⭐ Only in review. While an agent drives, the frames are keeping up with it
  // and freezing them at step 3 would be showing an old picture of a live thing.
  if (live) return
  for (const row of $('recallBody').querySelectorAll('[data-step]')) {
    row.onclick = () => {
      const step = Number(row.dataset.step)
      reviewUpTo = reviewUpTo === step ? null : step
      drawAgent()
    }
  }
}

/**
 * @param {object} session
 * @param {boolean} live - a run still going on; its steps are not clickable.
 * @returns {string} the steps of one run, newest last, as the record renders them.
 */
function recallRows(session, live) {
  const rows = session.actions.map((action) => {
    const refused = action.ok === false
      ? `<div class="err" style="margin:6px 0 0">${t('ui.refusedLine', { code: escape(action.code ?? ''), message: escape(action.message ?? '') })}</div>`
      : ''
    // ⭐ Who did it, on every step. With no takeover to open and close, two
    // agents and the person at this window all write into the same trail, and a
    // trail that cannot say which of them did a step is one column short of
    // answering the question it exists for.
    const who = action.by === undefined || action.by === null
      ? ''
      : ` <em style="display:inline">${escape(t('run.byProcess', { pid: action.by.pid }))}</em>`
    // The line is the record's own rendering, filled in from what the action
    // resolved to — so it runs to the same result whenever it is run, which the
    // line the agent typed would not.
    // Clickable in review, and the one being looked at says so — the frames on
    // the page above are the frames as of this step.
    const picked = !live && reviewUpTo === action.seq
    const step = live ? '' : ` data-step="${action.seq}"`
    return `<div class="item step${picked ? ' picked' : ''}"${step} style="display:block">
      <b>#${seqMark(action.seq)}</b> <em style="display:inline">${escape(clock(action.at))}</em>${who}
      <pre>${escape(action.line ?? action.command)}</pre>${refused}</div>`
  })
  return `<p class="sub" style="margin:0 0 4px">${t('ui.trailHead', { count: session.actions.length })}</p>${rows.join('')}`
}

/** What is happening at this moment — including the commands that leave no frame. */
function drawBadge(held) {
  if (held === null) return
  // Reported, not interpreted: every command running out there, with the process
  // that is running it and how long it has been at it. "Started 40 seconds ago"
  // is something a person can act on; "the agent is stuck" would be a guess.
  //
  // ⭐ All of them, not the newest one. Two agents at once is the case this whole
  // change is about, and a badge that showed one of them would be answering a
  // different question than the one being asked.
  const runs = held.runs ?? []
  const lines = runs.map((run) => t('ui.outsideRun', {
    pid: escape(run.pid), name: escape(run.command), ago: escape(ago(run.startedAt)),
  }))
  $('badgeText').innerHTML = `<b>${t('ui.outsideBusy')}</b>　${lines.join('　')}`
}

/**
 * Draw the numbered frames.
 *
 * Cleared and redrawn whole rather than patched, because the controls
 * underneath are rebuilt by every poll; a frame kept across a redraw would be a
 * frame on an element that no longer exists.
 */
function drawMarks(session, upTo = null) {
  for (const marked of document.querySelectorAll('.agent-mark')) {
    marked.classList.remove('agent-mark')
    marked.removeAttribute('data-seq')
  }
  for (const ghost of document.querySelectorAll('.ghost')) ghost.remove()
  if (session === null) return
  const upto = upTo === null ? Number.POSITIVE_INFINITY : upTo
  const seqs = new Map()
  for (const action of session.actions) {
    if (action.seq > upto) continue
    for (const key of markKeys(action)) {
      if (key === null) continue
      const seen = seqs.get(key) ?? []
      if (!seen.includes(action.seq)) seen.push(action.seq)
      seqs.set(key, seen)
    }
  }
  drawGhosts(session, seqs)
  for (const element of document.querySelectorAll('[data-mark]')) {
    const seen = element.dataset.mark.split(' ').flatMap((key) => seqs.get(key) ?? [])
    if (seen.length === 0) continue
    element.classList.add('agent-mark')
    // Comma-separated (CEO 2026-08-23): a control touched at steps 1 and 3 read
    // as "13" when the numbers were only spaced apart.
    element.dataset.seq = [...new Set(seen)].sort((a, b) => a - b).map(seqMark).join(',')
  }
}

/**
 * Dashed stand-ins for things this run got rid of.
 *
 * ⭐⭐ A step whose target no longer exists used to carry no frame at all, so
 * "the agent deleted that sandbox" was the one action review could not show —
 * the most consequential one. A dashed placeholder gives the frame somewhere to
 * land, and says what it is: gone.
 *
 * ⛔ Drawn **only** for things the record itself deleted (CEO 2026-08-23). That
 * one rule removes the need to ask any harder question — in particular whether
 * a name on the page today is the same thing as that name back then, which
 * cannot be answered from a name and could otherwise put a frame confidently
 * around the wrong sandbox. If a thing vanished for some other reason, there is
 * no ghost and no frame: less shown, nothing invented.
 * @param {{actions: {command: string, args?: Record<string, any>}[]}} session
 * @param {Map<string, number[]>} seqs - the keys the frames want.
 */
function drawGhosts(session, seqs) {
  const gone = new Map()
  for (const action of session.actions) {
    const args = action.args ?? {}
    if (action.command === 'rm.sandbox' && typeof args.sandbox === 'string') {
      gone.set(`cabinet:${args.sandbox}`, { where: 'workspaces', label: args.sandbox })
    }
    // ⭐ `rm plugin` 只从一个柜子里拿走,所以它常常**不**该留下墓碑 —— 那一行在别的
    // 柜子里还在,页面上也还在。下面 `onPage.has(key)` 那一关正好把这种情况挡掉:
    // 只有页面上真的再也找不到它时,框才需要一个落脚点。
    if (action.command === 'rm.plugin') {
      const id = args.id ?? args.target
      if (typeof id === 'string') gone.set(`plugin:${id}`, { where: 'plugins', label: id })
    }
  }
  const onPage = new Set()
  for (const element of document.querySelectorAll('[data-mark]')) {
    for (const key of element.dataset.mark.split(' ')) onPage.add(key)
  }
  for (const [key, what] of gone) {
    if (!seqs.has(key) || onPage.has(key)) continue
    const ghost = document.createElement('div')
    ghost.className = `ghost ${what.where === 'workspaces' ? 'chip' : 'check'}`
    ghost.dataset.mark = key
    ghost.innerHTML = `${escape(what.label)}<small>${t('ui.ghostDeleted')}</small>`
    $(what.where).append(ghost)
  }
}

/** How long ago, in words, without deciding what it means. */
function ago(at) {
  const seconds = Math.max(0, Math.round((Date.now() - new Date(at).getTime()) / 1000))
  if (seconds < 60) return t('ui.secondsAgo', { count: seconds })
  if (seconds < 3600) return t('ui.minutesAgo', { count: Math.round(seconds / 60) })
  return t('ui.hoursAgo', { count: Math.round(seconds / 3600) })
}

/** @param {string} at ISO timestamp. */
function clock(at) {
  return new Date(at).toLocaleTimeString()
}

$('recallToggle').onclick = () => {
  recallFolded = !recallFolded
  // ⭐ The whole of it, not just the panel: unfolding a past run is what turns
  // its frames on, so redrawing only the list would open a list of steps that
  // point at nothing — which is what it did until this was measured.
  drawAgent()
}

/** Clears the hint again, so it reads as an answer to one press. */
let hintTimer = null

/**
 * Say why that press did nothing.
 *
 * ⛔ Without it the refusal is silent, and the honest reading of a window that
 * does not respond is that it is broken. The frame and the badge do say an
 * agent is driving, but they say it at the top of the page and in general —
 * neither of them answers *this press*.
 */
function sayLocked() {
  $('lockedHint').classList.add('on')
  clearTimeout(hintTimer)
  hintTimer = setTimeout(() => $('lockedHint').classList.remove('on'), 2600)
}

/**
 * Show a long command's log while it runs.
 *
 * Downloading a release takes about two minutes and start takes tens of
 * seconds; a request that simply resolves at the end leaves a frozen line with
 * no way to tell progress from a hang. The window used to solve that with job
 * ids it invented and polled, while the command line solved the same problem
 * its own way — two mechanisms, one question.
 *
 * Now the command writes a log as it goes and this reads it with `logs`,
 * exactly as a person in another terminal would. Nothing here knows anything
 * the command line does not also know.
 *
 * `work` is already running when it arrives: the log has to be watched *while*
 * it happens, so the command is started first and awaited last.
 */
async function watchLog(host, argv, headline, work) {
  let done = false
  const show = (lines, failed) => {
    host.innerHTML = `<div class="${failed ? 'err' : 'ok'}">${headline}</div>`
      + `<pre>${escape(lines.join('\n'))}</pre>`
    const log = host.querySelector('pre')
    log.scrollTop = log.scrollHeight
  }
  show(['…'], false)
  const poll = (async () => {
    while (!done) {
      await new Promise((r) => setTimeout(r, 800))
      if (done) return
      try {
        const seen = await run([...argv, '--lines', '40'])
        if (!done) show(seen.lines ?? [], false)
      } catch {
        // No log yet is the ordinary state for the first second or two, and a
        // missing log must not replace the thing being reported.
      }
    }
  })()
  try {
    return await work
  } finally {
    done = true
    await poll
  }
}

/**
 * Take a folder as the machine for the next launch.
 *
 * ⛔ Sends nothing. Choosing which dsh to run is not an action on anything —
 * it becomes one only when `start` is pressed, and then it travels as
 * `--version`, exactly as a release number does.
 */
$('usePathBtn').onclick = () => {
  // "Copy as path" wraps the value in quotes, and this box is where a pasted
  // path lands; the same trimming happens again on the other side.
  const typed = $('enginePath').value.trim().replace(/^"|"$/g, '')
  if (typed === '') {
    $('pullOut').innerHTML = `<div class="err">${t('ui.pathNeeded')}</div>`
    return
  }
  version = typed
  $('enginePath').value = ''
  $('pullOut').innerHTML = ''
  drawVersions()
}

$('pullBtn').onclick = async () => {
  const wanted = $('customVersion').value.trim() || version
  // Empty means the machine already installed here is selected, which is not
  // something that can be downloaded. Saying so beats a button that does
  // nothing when pressed.
  if (wanted === '') {
    $('pullOut').innerHTML = `<div class="err">${t('ui.pullNeedsVersion')}</div>`
    return
  }
  // ⛔ `--version` carries two meanings now, and this button only understands
  // one of them. A folder is already on this computer; there is nothing to
  // fetch, and asking the registry for it would fail with a sentence about npm.
  if (/[\\/]/.test(wanted)) {
    $('pullOut').innerHTML = `<div class="err">${t('ui.pullNotAPath')}</div>`
    return
  }
  $('pullBtn').disabled = true
  try {
    const result = await watchLog($('pullOut'), ['logs', '--version', wanted],
      t('ui.pullingHead', { version: escape(wanted) }), run(['get', 'machine', wanted]))
    version = result.version
