# 三平台出包。不改源码:平台差异已在源码里按平台隔离,
# 这里只负责在三种系统上各跑一次同样的构建。
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
          - os: ubuntu-latest
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      # Tauri 在 Linux 上的渲染引擎与打包工具来自系统包,其它平台自带。
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci
      - run: npx tauri build --bundles ${{ matrix.bundles }}

      # 便携包(解压即用,数据长在 exe 旁)。借出货脚本的布局定义,只跳过构建
      # 那一步,免得同一套布局写两遍。必须在这里打而不是本地打:本地构建会把
      # 构建机的用户名写进 Rust 的 panic 路径。
      - name: Windows portable zip
        if: runner.os == 'Windows'
        run: node tools/build-releases.mjs --skip-build

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-box-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            Releases/*-portable.zip
          if-no-files-found: error
